name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Check REUSE compliance
        run: uvx --from 'reuse~=6.2.0' reuse lint

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { "-p:Version=$($env:GITHUB_REF_NAME.Substring(1))" }
          dotnet build -c Release -warnaserror $version

      - name: Test
        run: dotnet test -c Release --no-build

      - uses: actions/upload-artifact@v7
        with:
          name: wendel
          path: src/Wendel/bin/Release/net48/wendel.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME src/Wendel/bin/Release/net48/wendel.exe --verify-tag --generate-notes --draft

  virustotal:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wendel

      - name: Scan and add the result to the draft
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          vt() { curl -fsS -H "x-apikey: $VT_API_KEY" "$@"; }

          upload=$(vt -F file=@wendel.exe https://www.virustotal.com/api/v3/files)
          id=$(jq -r .data.id <<< "$upload")

          # The public API allows 4 requests per minute.
          status=
          for _ in {1..30}; do
            sleep 30
            analysis=$(vt "https://www.virustotal.com/api/v3/analyses/$id")
            status=$(jq -r .data.attributes.status <<< "$analysis")
            if [ "$status" = completed ]; then break; fi
          done
          if [ "$status" != completed ]; then
            echo "::error::VirusTotal did not finish in time"
            exit 1
          fi

          flagged=$(jq '.data.attributes.stats | .malicious + .suspicious' <<< "$analysis")
          engines=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<< "$analysis")
          sha256=$(sha256sum wendel.exe | cut -d' ' -f1)
          result="VirusTotal: $flagged of $engines engines flagged wendel.exe ([report](https://www.virustotal.com/gui/file/$sha256))"

          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          printf '\n%s\n' "$result" >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

          echo "$result"
          if [ "$flagged" -gt 0 ]; then
            echo "::error::$flagged of $engines VirusTotal engines flagged wendel.exe"
            exit 1
          fi
